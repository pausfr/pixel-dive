<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">

<title>Pixel Dive</title>
<style>
:root{--bg:#e8e8e8;--fg:#222;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

</style></head><body>
<canvas id="c" width="240" height="160"></canvas>
<div>클릭/스페이스로 진행</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=240,H=160,BY=60,WY=130,YE=WY-18,G=70,VX=42,BX=60,BW=120,GY=16,BH=8,LY=84,VT=260,VF=320,FIN=.3,VS=10,TL=4.4;
const CAPS=[7,7.3,7.8,8.3,8.7,9.1,9.5,10,10,10];
const NAMES=['BAD','GOOD','PERFECT'];
const FD={A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',F:'111100110100100',G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',K:'101101110101101',L:'100100100100111',M:'101111111101101',N:'110101101101101',O:'010101101101010',P:'110101110100100',R:'110101110101101',S:'011100010001110',T:'111010010010010',U:'101101101101111',V:'101101101101010',W:'101101111111101',X:'101101010101101',Y:'101101010010010',Z:'111001010100111',0:'111101101101111',1:'010110010010111',2:'110001010100111',3:'110001010001110',4:'101101111001001',5:'111100110001110',6:'011100111101111',7:'111001001010010',8:'111101111101111',9:'111101111001110','.':'000000000000010','/':'001001010100100',':':'000010000010000','-':'000000111000000','!':'010010010000010'};
const STAR='0010011111011100111011011';
function star2(x,y,f){const m=(a,b)=>a>=0&&b>=0&&a<10&&b<10&&STAR[(b>>1)*5+(a>>1)]==='1';
 for(let b=0;b<10;b++)for(let a=0;a<10;a++)if(m(a,b)&&(f||!(m(a-1,b)&&m(a+1,b)&&m(a,b-1)&&m(a,b+1))))px(x+a,y+b)}
function arrow(x,y,dir){box(x,y,18,16);for(let i=0;i<5;i++)px(dir<0?x+5+i:x+12-i,y+8-i,1,2*i+1)}
function menuUI(){
 arrow(40,31,-1);arrow(182,31,1);
 txt('LEVEL '+d,120,34,2,true);
 for(let i=0;i<10;i++)star2(61+i*12,52,i<d);
 txt('MAX SCORE '+CAPS[d-1].toFixed(1),120,72,1,true);
 txt(d<4?'EASY':d<7?'NORMAL':d<9?'HARD':'EXTREME',120,84,1,true);
 px(80,104,80,24);ctx.fillStyle='#fff';txt('START',120,111,2,true);ctx.fillStyle='#000';
 txt('TAP STARS OR ARROWS',120,140,1,true);
}
const TR=[1.4,2.4,3.4],JX=[178,202,226];
let jT=0,jn=0,fw=[],rk=[],fwT=0,fwN=0,cf=[],cbN=0,sk=[];
const OS=TR[2]+.5,CC=['#e53030','#f2b02e','#3a73d6','#2fb85a','#d63ab8','#2fc4d6'];
function burst(){for(const sd of[-1,1])for(let i=0;i<40;i++){const a=(48+Math.random()*24)*Math.PI/180,v=70+Math.random()*70;
 cf.push({x:sd<0?12:W-12,y:H-28,vx:sd*Math.cos(a)*v*(.6+Math.random()*.6),vy:-Math.sin(a)*v,c:CC[(Math.random()*CC.length)|0],ph:Math.random()*6.28})}}
function cannon(sd){const f=sd<0?x=>x:x=>W-x;ctx.fillStyle='#000';
 for(let i=0;i<10;i++){const x=2+i;px(sd<0?x:W-x-3,H-18-i,3,3)}
 px(sd<0?0:W-12,H-14,12,3);px(sd<0?0:W-9,H-11,9,11);
 if(jT>OS&&jT<OS+2.8&&(jT-OS)%.7<.1){ctx.fillStyle='#f2b02e';px(f(11),H-29,4,4)}ctx.fillStyle='#000'}
const JH=18,JF=[1,2,3].map(n=>{const i=new Image();i.src='img/judge'+n+'.png';return i});
const SD=[{j:'#2d3a5e',k:'#1e2742',h:'#5a6ea0',t:'#d63a2f'},{j:'#45454b',k:'#2c2c31',h:'#7a7a84',t:'#e3b32e'},{j:'#5b3a2a',k:'#3f2619',h:'#8f6a52',t:'#3a73d6'}];
const mkSuit=(o,arms)=>{
 const C={J:o.j,K:o.k,H:o.h,T:o.t,W:'#fff',S:'#f2b07a',D:'#c47a4c',O:'#1b1b1b'},w=23,h=12,cx=11,m=[...Array(h)].map(()=>Array(w).fill(null));
 const set=(x,y,k)=>{m[y+1][cx+x]=k;m[y+1][cx-x]=k},row=(y,x0,x1,k)=>{for(let x=x0;x<=x1;x++)set(x,y,k)};
 [5,8,9,9,9,9,9,9,9,9].forEach((v,y)=>row(y,0,arms?v:Math.min(v,5),'J'));
 if(arms)for(let y=2;y<=9;y++)set(6,y,'K');row(5,2,5,'K');
 [2,2,2,1,1,0].forEach((v,y)=>row(y,0,v,'W'));[3,3,3,2,2,1].forEach((v,y)=>set(v,y,'H'));
 for(let y=1;y<=8;y++)set(0,y,'T');row(1,0,1,'T');
 if(arms){row(7,7,9,'W');row(8,7,9,'S');row(9,7,9,'S');set(9,9,'D');set(9,8,'D')}
 const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){let k=m[y][x];if(!k&&[[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>m[y+dy]&&m[y+dy][x+dx]))k='O';if(k){g.fillStyle=C[k];g.fillRect(x,y,1,1)}}
 return c;
};
const SUITS=SD.map(o=>mkSuit(o,1)),SUITN=SD.map(o=>mkSuit(o,0));
function judges(){
 px(166,102,72,4);px(168,106,3,WY-106);px(233,106,3,WY-106);
 JX.forEach((x,i)=>{
  if(mode!=='judge'){px(x-1,93,3,3);px(x-2,96,5,6);return}
  const ov=res.react==='ovation'&&jT>OS,cl=res.react!=='still'&&jT>TR[i]+.4;
  let lift=0;if(ov){lift=-Math.round(Math.min(1,(jT-OS)/.25)*6);if(jT>OS+.25)lift-=Math.round(Math.abs(Math.sin(now*9+i))*2)}
  if(jT>TR[i]){
   const u=Math.min(1,(jT-TR[i])/.25),bt=Math.round(84-u*24),v=res.js[i];
   ctx.fillStyle='#fff';px(x-6,bt,13,9);ctx.fillStyle='#000';box(x-6,bt,13,9);
   txt(v>=100?'10':(v/10).toFixed(1),x-5,bt+2);
   if(bt+9<94-JH)px(x,bt+9,1,94-JH-bt-9);
  }
  if(lift<0){ctx.fillStyle=SD[i].j;px(cl?x-5:x-9,103+lift,cl?11:19,-lift-1);ctx.fillStyle='#000'}
  ctx.save();ctx.imageSmoothingEnabled=false;ctx.drawImage((cl?SUITN:SUITS)[i],x-11,91+lift);ctx.restore();
  const im=JF[i];if(im.complete&&im.naturalWidth){const w=Math.round(JH*im.naturalWidth/im.naturalHeight);
   ctx.save();ctx.imageSmoothingQuality='high';ctx.drawImage(im,Math.round(x-w/2),94-JH+lift,w,JH);ctx.restore()}
  if(cl){const o=((now*(ov?10:6))|0)&1?4:1,hy=(ov?95:98)+lift;
   for(const sd of[-1,1]){const hx=x+sd*o-2;ctx.fillStyle='#000';px(hx-1,hy-1,5,5);ctx.fillStyle='#f2b07a';px(hx,hy,3,3)}ctx.fillStyle='#000'}
 });
}
function px(x,y,w=1,h=1){ctx.fillRect(Math.round(x),Math.round(y),w,h)}
function txt(s,x,y,sc=1,c=false){s=String(s).toUpperCase();if(c)x=Math.round(x-(s.length*4*sc-sc)/2);for(const ch of s){const g=FD[ch];if(g)for(let i=0;i<15;i++)if(g[i]==='1')px(x+(i%3)*sc,y+((i/3)|0)*sc,sc,sc);x+=4*sc}}
function star(x,y){for(let i=0;i<25;i++)if(STAR[i]==='1')px(x+i%5,y+((i/5)|0),1,1)}
function box(x,y,w,h){px(x,y,w,1);px(x,y+h-1,w,1);px(x,y,1,h);px(x+w-1,y,1,h)}

let mode='menu',d=1,pv=1,pdir=1,gm,tm,ti=0,rt=[],pops=[],parts=[],splT=0,res,now=0,last=0,cam=0,bot=1e4;
const P=()=>{const k=d/10,f=gm&&mode!=='power'?(1-gm.power/100)*k:0;return{spd:(.5+d*.32)*(1+f*.8),pw:(.16-d*.0125)*(1-f*.45),gw:(.40-d*.031)*(1-f*.45),ps:40+d*19}};

function startGame(){mode='ready';rt=[];ti=0;pv=1;pdir=1;pops=[];parts=[];gm=null}
function doJump(){const power=Math.round(pv),h=8+power*.42;gm={power,x:24,y:DY,vy:-Math.sqrt(2*G*h),apex:DY-h,fT:0,gap:.8,cam:0,D:null,th:0,tt:99,cp:0,fx:0,tk:'',lk:''};mode='jump'}
function judge(){const p=P(),dist=Math.abs(tm.m-tm.c),r=dist<=p.pw/2?2:dist<=p.gw/2?1:0;rt.push(r);ti++;pops.push({s:NAMES[r],t:.9});mode='jump';gm.gap=1.1;gm.tt=0;gm.fx=0;gm.tk=r===2?(['prop','cork'].filter(k=>k!==gm.lk)[Math.floor(Math.random()*(gm.lk?1:2))]):r===1?'eagle':'flail';if(r===2)gm.lk=gm.tk;if(ti>=3)gm.D=Math.round(gm.cam+500)}
function entry(){const tier=rt.reduce((a,b)=>a+b,0),n=6+(6-tier)*4,sp=20+(6-tier)*12;
 for(let i=0;i<n;i++)parts.push({x:gm.x,y:WY,vx:(Math.random()-.5)*sp,vy:-(20+Math.random()*(30+(6-tier)*10))});
 mode='splash';splT=0}
function finish(){const tier=rt.reduce((a,b)=>a+b,0),raw=tier/6*7+gm.power/100*3,cap=CAPS[d-1];
 res={score:Math.round(Math.min(raw,tier===6?cap:cap-.1)*10)/10,cap,power:gm.power,rt:rt.slice()};
 const s=Math.round(res.score*10),lim=Math.min(100,Math.round(cap*10));let o=[0,0,0];
 if(s>=6&&lim-s>=6){const a=Math.floor(Math.random()*7)-3,b=Math.floor(Math.random()*7)-3;o=[a,b,-(a+b)]}
 res.js=o.map(v=>s+v);res.react=tier===6?'ovation':tier===0?'still':'clap';cf=[];cbN=0;jT=0;jn=0;mode='judge'}

function act(lx,ly){
 if(mode==='menu'){
  if(lx==null){startGame();return}
  if(ly>=26&&ly<=52&&lx>=34&&lx<=62){d=Math.max(1,d-1);return}if(ly>=26&&ly<=52&&lx>=178&&lx<=206){d=Math.min(10,d+1);return}if(ly>=46&&ly<=70&&lx>=59&&lx<=181){d=Math.max(1,Math.min(10,Math.floor((lx-61)/12)+1));return}
  if(lx>=80&&lx<=160&&ly>=100&&ly<=130)startGame();
 }else if(mode==='ready')mode='power';
 else if(mode==='power')doJump();
 else if(mode==='timing'){if(tm.t>.12)judge()}
 else if(mode==='result'){mode='menu';fw=[];rk=[];cf=[]}
}
cv.addEventListener('pointerdown',e=>{e.preventDefault();const r=cv.getBoundingClientRect();act((e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H)});
addEventListener('keydown',e=>{
 if(e.code==='Space'||e.code==='Enter'){e.preventDefault();act(null,null)}
 if(mode==='menu'){if(e.code==='ArrowRight')d=Math.min(10,d+1);if(e.code==='ArrowLeft')d=Math.max(1,d-1)}
});

function step(dt){
 for(const q of pops)q.t-=dt;pops=pops.filter(q=>q.t>0);
 for(const q of parts){q.vy+=150*dt;q.x+=q.vx*dt;q.y+=q.vy*dt}parts=parts.filter(q=>q.y<=WY+1);
 if(mode==='judge'){jT+=dt;while(jn<3&&jT>TR[jn])jn++;if(res.react==='ovation')while(cbN<4&&jT>OS+cbN*.7){cbN++;burst()}
  if(jT>(res.react==='ovation'?7:5)){mode='result';fwT=0;fwN=3+Math.round(res.score)}}
 if(mode==='result'){fwT-=dt;if(fwN>0&&fwT<=0){fwN--;fwT=.3+Math.random()*.3;rk.push({x:30+Math.random()*180,y:H,ty:25+Math.random()*50})}
  for(const r of rk){r.y-=110*dt;if(r.y<=r.ty){r.dead=1;for(let i=0;i<22;i++){const a=i/22*6.283,s=28+Math.random()*22;fw.push({x:r.x,y:r.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:1.1})}}}
  rk=rk.filter(r=>!r.dead)}
 for(const q of cf){q.vx*=1-1.2*dt;q.vy=q.vy<30?q.vy+90*dt:30;q.x+=q.vx*dt+Math.sin(q.ph)*8*dt;q.y+=q.vy*dt;q.ph+=dt*9}cf=cf.filter(q=>q.y<H);
 for(const q of sk){q.vy+=60*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.t-=dt}sk=sk.filter(q=>q.t>0);
 for(const q of fw){q.vy+=50*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.t-=dt}fw=fw.filter(q=>q.t>0);
 if(mode==='power'){pv+=pdir*P().ps*dt;if(pv>=100){pv=100;pdir=-1}if(pv<=1){pv=1;pdir=1}}
 else if(mode==='jump'||mode==='timing'){
  gm.x=Math.min(100,gm.x+VX*dt);gm.tt+=dt;
  if(gm.vy<0)gm.vy+=G*dt;
  else{const tg=mode==='timing'?VS:ti>=3?VF:VT;gm.vy=gm.vy<tg?Math.min(tg,gm.vy+700*dt):gm.vy+(tg-gm.vy)*Math.min(1,dt*10)}
  if(gm.vy>=0){const r=ti?rt[ti-1]:1,T=ti>=3?1.3:1,on=ti>0&&gm.tt<T&&mode==='jump';
   if(on&&gm.tt<T-FIN){if(gm.tk==='prop')gm.th+=20*6.283*dt;else if(gm.tk==='eagle')gm.th+=1.5*6.283*dt;else if(gm.tk==='cork')gm.cp+=20*6.283*dt}
   else{const tg=ti>=3?Math.round((gm.th-Math.PI)/6.283)*6.283+Math.PI:Math.round(gm.th/6.283)*6.283;gm.th+=(tg-gm.th)*Math.min(1,dt*8)}
   if(on&&r===2&&!gm.fx&&gm.tt>=T-FIN){gm.fx=1;for(let i=0;i<22;i++){const a=i/22*6.283,v=60+Math.random()*50;sk.push({x:gm.x,y:gm.y-gm.cam,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:.55,c:CC[i%CC.length]})}}}
  gm.y+=gm.vy*dt;gm.cam=Math.max(gm.cam,Math.min(gm.y-LY,gm.D==null?1e9:gm.D));
  if(gm.vy>0){gm.fT+=dt;
   if(mode==='jump'&&ti<3){gm.gap-=dt;if(gm.gap<=0){mode='timing';tm={m:0,dir:1,c:.2+Math.random()*.6,t:0}}}}
  if(mode==='timing'){
   tm.t+=dt;tm.m+=tm.dir*P().spd*dt;
   if(tm.m>=1){tm.m=1;tm.dir=-1}if(tm.m<=0){tm.m=0;tm.dir=1}
   if(tm.t>TL)judge();
  }
  if(gm.D!=null&&gm.y>=YE+gm.D)entry();
 }else if(mode==='splash'){splT+=dt;if(splT>1.6)finish()}
}

const SPW=64,SPH=64,SCX=32,SCY=22,SPY=SCY+15,DY=BY-16;
const SC={S:'#f2b07a',D:'#c47a4c',H:'#ffd9b3',O:'#1b1b1b',R:'#e53030',Q:'#9e1b1b',W:'#fff'};
const PS=(a,g,a2=a.map(v=>-v),g2=g.map(v=>-v))=>[...a,...a2,...g,...g2];
const lerpP=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
const POSE={idle:[PS([16,6],[3,0]),PS([21,11],[3,0])],crouch:PS([42,24],[55,-25]),rise:PS([155,165],[8,3]),float:PS([85,60],[14,6]),
 flail:[PS([120,60],[40,20],[-35,-150],[-12,-50]),PS([50,150],[-8,-40],[-110,-70],[30,10])],tuck:PS([22,-65],[140,15]),
 flex:[PS([90,192],[18,8]),PS([90,200],[20,10])],dive:PS([195,190],[2,0]),eagle:PS([125,130],[22,14]),star:PS([150,160],[26,16]),flop:PS([100,95],[28,22])};
const SPS=new Map();
function sprite(p){
 const key=p.map(Math.round).join();let sp=SPS.get(key);if(sp)return sp;
 const blank=()=>[...Array(SPH)].map(()=>Array(SPW).fill(null)),m=blank();
 const stamp=(g,x,y,r,k='S')=>{const X=SCX+x,Y=SCY+y;for(let j=Math.floor(Y-r);j<=Math.ceil(Y+r);j++)for(let i=Math.floor(X-r);i<=Math.ceil(X+r);i++)if((i-X)**2+(j-Y)**2<=r*r)g[j][i]=k};
 const seg=(g,x,y,a,len,r0,r1,bu)=>{const n=Math.ceil(len*2),dx=Math.sin(a*Math.PI/180),dy=Math.cos(a*Math.PI/180);for(let s=0;s<=n;s++){const t=s/n;stamp(g,x+dx*len*t,y+dy*len*t,r0+(r1-r0)*t+bu*Math.sin(Math.PI*t))}return[x+dx*len,y+dy*len]};
 const paint=(g,sh)=>{const has=(j,i)=>g[j]&&g[j][i];
  for(let j=0;j<SPH;j++)for(let i=0;i<SPW;i++){
   if(g[j][i]){let k=g[j][i];if(sh&&k==='S'){if(!has(j,i+1)||!has(j+1,i))k='D';else if(!has(j-1,i-1))k='H'}m[j][i]=k}
   else if([-1,0,1].some(dj=>[-1,0,1].some(di=>has(j+dj,i+di))))m[j][i]='O';
  }};
 const leg=(sd,th,sh)=>{const g=blank(),[kx,ky]=seg(g,sd*2.5,17.5,th,6.4,2.2,2,.3),[ax,ay]=seg(g,kx,ky,sh,5.8,2,1.4,.6);stamp(g,ax+sd*1.2,ay+.6,1.3,'D');paint(g,1)};
 const arm=(sd,u,l)=>{const g=blank();stamp(g,sd*7,3.5,3.1);const[ex,ey]=seg(g,sd*7,3.5,u,6,2.8,2.2,1),[hx,hy]=seg(g,ex,ey,l,5.5,2.3,1.7,.4);stamp(g,hx,hy,2.1,'D');paint(g,1)};
 leg(1,p[4],p[5]);leg(-1,p[6],p[7]);
 const t=blank(),set=(x,y,k)=>{t[SCY+y][SCX+x]=k;t[SCY+y][SCX-x]=k},row=(y,x0,x1,k)=>{for(let x=x0;x<=x1;x++)set(x,y,k)};
 const hw={2:5,3:6,4:6,5:5,6:5,7:5,8:4,9:4,10:4,11:4};
 row(0,0,1,'S');row(1,0,1,'S');for(const y in hw)row(+y,0,hw[y],'S');
 for(let y=3;y<=5;y++)set(0,y,'D');row(6,1,4,'D');set(2,4,'H');set(3,4,'H');
 for(let y=7;y<=11;y++)set(0,y,'D');row(8,1,2,'D');row(10,1,2,'D');
 row(12,0,4,'W');for(let y=13;y<=19;y++){row(y,0,4,'R');set(4,y,'Q')}
 paint(t,0);
 arm(1,p[0],p[1]);arm(-1,p[2],p[3]);
 const c=document.createElement('canvas');c.width=SPW;c.height=SPH;const x=c.getContext('2d');let bot=0;
 for(let j=0;j<SPH;j++)for(let i=0;i<SPW;i++)if(m[j][i]){x.fillStyle=SC[m[j][i]];x.fillRect(i,j,1,1);bot=Math.max(bot,j+1)}
 sp={c,bot:bot-SPY};SPS.set(key,sp);return sp;
}
function airPose(){
 if(!ti)return gm.vy<0?POSE.rise:POSE.float;
 const r=rt[ti-1],f=((now*14)|0)&1;
 if(gm.tt>=(ti>=3?1.3:1))return ti>=3?(rt.reduce((a,b)=>a+b,0)>=3?POSE.dive:POSE.flop):POSE.float;
 if(r===0)return POSE.flail[f];
 if(r===1)return POSE.eagle;
 if(gm.tt>=(ti>=3?1.3:1)-FIN)return POSE.star;
 return gm.tk==='cork'?POSE.dive:POSE.tuck;
}
const FH=18,FOY=-22;
const FACES=['angry','normal','happy'].map(n=>{const i=new Image();i.src='img/face_'+n+'.png';return i});
function face(cx,cy,a,sx=1){
 const r=rt.length?rt[rt.length-1]:1,im=FACES[r];if(!im.complete||!im.naturalWidth)return;
 const c=Math.cos(a),sn=Math.sin(a),x=.5*c-FOY*sn,y=.5*sn+FOY*c,w=Math.round(FH*im.naturalWidth/im.naturalHeight);
 ctx.save();ctx.imageSmoothingQuality='high';ctx.translate(Math.round(cx+x),Math.round(cy+y));ctx.rotate(a);ctx.scale(sx,1);
 ctx.drawImage(im,-w/2,-FH/2,w,FH);ctx.restore();
}
function diver(cx,cy,a,p,gnd,sx=1){
 const sp=sprite(p);if(gnd)cy=BY-sp.bot;
 ctx.save();ctx.imageSmoothingEnabled=false;ctx.translate(Math.round(cx),Math.round(cy));ctx.rotate(a);ctx.scale(sx,1);ctx.drawImage(sp.c,-SCX,-SPY);ctx.restore();
 if(sx>.15)face(cx,cy,a,sx);
}
function bar(){box(BX,GY,BW,BH)}
function view(){
 if(gm&&(mode==='jump'||mode==='timing')){cam=gm.cam;bot=gm.D==null?1e4:gm.D-gm.cam}
 else if(gm&&(mode==='splash'||mode==='judge')){cam=gm.D;bot=0}
 else{cam=0;bot=1e4}
}
function mkCloud(cs,w,h,col){
 const m=[...Array(h)].map((_,y)=>[...Array(w)].map((_,x)=>cs.some(([cx,cy,r])=>(x+.5-cx)**2+(y+.5-cy)**2<=r*r)));
 const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
 for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(m[y][x]){const e=![[1,0],[-1,0],[0,1],[0,-1]].every(([dx,dy])=>m[y+dy]&&m[y+dy][x+dx]);g.fillStyle=e?col:'#fff';g.fillRect(x,y,1,1)}
 return c;
}
const CT=[[44,18,[[9,18,8],[21,14,11],[34,18,9],[22,18,12]]],[30,13,[[8,13,6],[16,10,8],[24,13,6]]],[60,22,[[12,22,10],[27,15,14],[44,20,12],[31,22,16]]]];
const CL=[...Array(14)].map((_,k)=>{const par=[.4,.6,.9,1.3][k%4],t=CT[k%3];
 return{s:mkCloud(t[2],t[0],t[1],par<.8?'#cfcfcf':'#9a9a9a'),par,x:(k*71)%W,y:(k*53)%260,sp:(k%2?1:-1)*(2+k%3)}});
function clouds(){
 ctx.save();ctx.beginPath();ctx.rect(0,0,W,Math.min(H,WY+bot));ctx.clip();
 for(const c of CL){const y=((c.y-cam*c.par)%260+260)%260-60,x=((c.x+now*c.sp)%(W+90)+W+90)%(W+90)-60;ctx.drawImage(c.s,Math.round(x),Math.round(y))}
 if((mode==='jump'||mode==='timing')&&gm.cam>0&&gm.vy>40){ctx.fillStyle='#d4d4d4';
  for(let k=0;k<10;k++)px((k*53+17)%W,((k*47-cam*2.2)%190+190)%190-20,1,7);ctx.fillStyle='#000'}
 ctx.restore();
}
function scene(){
 if(mode==='judge'){const e=Math.min(1,jT/.9),z=1+2*(e*e*(3-2*e));ctx.save();ctx.translate(Math.round(120-202*z),Math.round(80-81*z));ctx.scale(z,z)}
 const ty=Math.round(BY-cam);if(ty<H){px(0,ty,30,2);px(0,ty,4,H-ty)}
 if(bot<H){ctx.save();ctx.translate(0,Math.round(bot));judges();
  for(let x=0;x<W;x+=2)if(((x>>1)+((now*6)|0))%3)px(x,WY+Math.round(Math.sin(x/6+now*3)),2,1);
  for(let y=WY+8;y<H-bot;y+=6)for(let x=((y/6)&1)*3;x<W;x+=6)px(x,y,2,1);
  ctx.restore()}
}

function draw(){
 ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.fillStyle='#000';
 if(mode==='menu'){
  txt('DIVE',120,6,4,true);menuUI();
 }else if(mode==='result'){
  for(const q of fw){if(q.t>.3||((now*30)|0)&1){const b=q.t>.6?2:1;px(q.x,q.y,b,b)}}for(const r of rk)px(r.x,r.y,1,3);
  txt('RESULT',120,8,2,true);txt(res.score.toFixed(1),120,28,4,true);txt('MAX '+res.cap.toFixed(1),120,52,1,true);
  res.rt.forEach((r,i)=>txt((i+1)+' '+NAMES[r],120,66+i*10,1,true));
  txt('POWER '+res.power,120,100,1,true);
  for(let i=0;i<d;i++)star(120-d*5+i*10+2,114);
  if(((now*2)|0)%2)txt('CLICK',120,140,1,true);
 }else{
  view();if(mode!=='judge')clouds();scene();
  if(mode==='ready'){diver(24,DY,0,POSE.idle[((now*2)|0)&1],1);if(((now*2)|0)%2)txt('CLICK TO JUMP',120,10,1,true)}
  if(mode==='power'){
   diver(24,DY,0,lerpP(POSE.idle[0],POSE.crouch,pv/100),1);txt('POWER '+Math.round(pv),120,6,1,true);bar();
   px(BX+1,GY+1,(BW-2)*pv/100,BH-2);
   for(let i=1;i<4;i++)px(BX+1+(BW-2)*i/4,GY+BH+1,1,2);
  }
  if(mode==='jump'||mode==='timing'){
   const r=ti?rt[ti-1]:1,T=ti>=3?1.3:1,on=ti>0&&gm.tt<T,fin=on&&r===2&&gm.tt>=T-FIN,cork=on&&gm.tk==='cork'&&!fin,
    th=gm.th+(on?(r===0?Math.sin(now*16)*.9:0):Math.sin(now*2)*.12),py=gm.y-gm.cam;
   if(on&&mode==='jump'&&r>0&&!cork&&!fin)for(const o of[1,2]){ctx.globalAlpha=.3/o;diver(gm.x,py,th-o*(gm.tk==='prop'?.9:.4),airPose())}ctx.globalAlpha=1;
   diver(gm.x,py,th,airPose(),0,cork?Math.cos(gm.cp):1);
  }
  if(mode==='timing'){
   const p=P(),iw=BW-2;txt('TIMING '+(ti+1)+'/3',120,6,1,true);bar();
   const gx=Math.round(BX+1+(tm.c-p.gw/2)*iw),gw=Math.round(p.gw*iw);
   for(let x=gx;x<gx+gw;x++)for(let y=GY+1;y<GY+BH-1;y++)if((x+y)&1)px(x,y);
   px(Math.round(BX+1+(tm.c-p.pw/2)*iw),GY+1,Math.max(2,Math.round(p.pw*iw)),BH-2);
   const tr=1-tm.t/TL;box(BX,GY+BH+6,BW,4);if(tr>.25||((now*8)|0)&1)px(BX+1,GY+BH+7,Math.round(iw*tr),2);
   const mx=BX+1+Math.round(tm.m*(iw-2));
   ctx.fillStyle='#fff';px(mx,GY+1,1,BH-2);ctx.fillStyle='#000';
   px(mx-1,GY+1,1,BH-2);px(mx+1,GY+1,1,BH-2);px(mx,GY-4,1,3);px(mx,GY+BH+1,1,3);
  }
  for(const q of parts)px(q.x,q.y,1,1);
  if(mode==='splash'&&splT<1){const r=splT*30;px(gm.x-r,WY-1,4,1);px(gm.x+r,WY-1,4,1)}
  if(mode==='judge')ctx.restore();
  if(pops.length)txt(pops[pops.length-1].s,120,30,2,true);
 }
}
function overlay(){for(const q of sk){ctx.fillStyle=q.c;const b=q.t>.2?2:1;px(q.x,q.y,b,b)}ctx.fillStyle='#000';
 if(mode==='judge'&&res.react==='ovation'&&jT>OS-.5){cannon(-1);cannon(1)}
 for(const q of cf){ctx.fillStyle=q.c;if(Math.sin(q.ph*1.7)>0)px(q.x,q.y,2,1);else px(q.x,q.y,1,2)}ctx.fillStyle='#000'}
function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;now=t/1000;step(dt);draw();overlay();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
